[Unit]
# Drop-in for rustdesk.service:
#   /etc/systemd/system/rustdesk.service.d/wayland.conf
# Forces Wayland/portal (PipeWire) capture instead of Xwayland fallback.
# Portal capture enumerates each monitor separately -> the client gets a
# real display switch. Xwayland capture = one combined X screen.

[Service]
Environment=RUSTDESK_FORCED_DISPLAY_SERVER=wayland
